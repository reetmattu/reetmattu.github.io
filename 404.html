<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Reet Mattu</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#12100d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#12100d; --text:#fff7e8; --muted:#b9aa91; --gold:#c79b52; --green:#6f7f4d; --burgundy:#6d2639; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(111,127,77,.32), transparent 28rem),
        radial-gradient(circle at 80% 78%, rgba(109,38,57,.36), transparent 26rem),
        var(--bg);
      overflow: hidden;
    }
    main { width: min(900px, 100%); text-align: center; }
    .code {
      font: 700 clamp(7rem, 28vw, 19rem)/.76 "Playfair Display", Georgia, serif;
      letter-spacing: -.09em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,247,232,.72);
      text-shadow: 0 28px 80px rgba(199,155,82,.18);
    }
    h1 { margin: 22px 0 10px; font: 700 clamp(2.3rem, 7vw, 5.6rem)/.92 "Playfair Display", Georgia, serif; letter-spacing: -.055em; }
    p { margin: 0 auto 28px; max-width: 570px; color: var(--muted); font-size: 1.05rem; }
    a {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      padding: 15px 22px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--gold), var(--green) 60%, var(--burgundy));
      color: #17130f;
      text-decoration: none;
      font-weight: 900;
    }
    .shape { position: fixed; width: 180px; height: 260px; border: 1px solid rgba(255,247,232,.18); border-radius: 14px; transform: rotate(-12deg); left: 8%; bottom: 8%; }
    .shape:last-child { width: 220px; height: 130px; left: auto; bottom: auto; right: 8%; top: 12%; transform: rotate(9deg); background: rgba(199,155,82,.08); }
  </style>
</head>
<body>
  <div class="shape" aria-hidden="true"></div>
  <div class="shape" aria-hidden="true"></div>
  <main>
    <div class="code">404</div>
    <h1>This frame drifted off brief.</h1>
    <p>The page you requested is missing, renamed, or still waiting for its final art direction.</p>
    <a href="index.html">Return to the portfolio</a>
  </main>
</body>
</html>
